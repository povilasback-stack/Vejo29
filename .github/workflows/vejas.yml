name: Vejo pranesimai

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Siusti bandomaja zinute"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vejo-pranesimai
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tikrinti veja
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
        run: |
          python - <<'PY'
          import json, os, sys, math
          import urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          def api(url, service, data=None):
              try:
                  req = urllib.request.Request(url, data=data)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"{service}: HTTP {e.code}") from None
              except Exception:
                  raise RuntimeError(f"{service}: rysio arba atsakymo klaida") from None

          def main():
              token = os.environ.get("TOKEN", "").strip()
              chat = os.environ.get("CHAT", "").strip()
              test = os.environ.get("TEST", "").lower() == "true"
              if not token or not chat:
                  raise RuntimeError("Truksta TOKEN arba CHAT_ID Secrets nustatymuose.")

              params = urllib.parse.urlencode({
                  "latitude": 55.4566591,
                  "longitude": 21.1061368,
                  "current": "wind_speed_10m,wind_direction_10m,wind_gusts_10m",
                  "wind_speed_unit": "ms",
                  "timeformat": "unixtime"
              })
              print("Gaunami Open-Meteo duomenys...", flush=True)
              w = api("https://api.open-meteo.com/v1/forecast?" + params, "Open-Meteo")
              c = w["current"]
              d = float(c["wind_direction_10m"])
              s = float(c["wind_speed_10m"])
              g = float(c["wind_gusts_10m"])
              t = float(c["time"])

              if not all(math.isfinite(v) for v in (d, s, g, t)):
                  raise RuntimeError("Netinkami vejo duomenys.")
              if not 0 <= d <= 360 or min(s, g) < 0:
                  raise RuntimeError("Netinkamos vejo reiksmes.")
              age = datetime.now(timezone.utc).timestamp() - t
              if not -1800 <= age <= 7200:
                  raise RuntimeError("Duomenu laikas netinkamas arba pasenes.")

              inside = 90 <= d <= 135
              path = Path("wind_state.json")
              previous = False
              if path.exists():
                  previous = json.loads(path.read_text())["inside"]
                  if not isinstance(previous, bool):
                      raise RuntimeError("Netinkamas busenos failas.")

              print(f"Kryptis {d:.0f}°, greitis {s:.1f} m/s", flush=True)
              if test or (inside and not previous):
                  title = "Bandomoji zinute" if test else "Vejo pranesimas"
                  date = datetime.fromtimestamp(t, ZoneInfo("Europe/Vilnius"))
                  condition = "TAIP" if inside else "NE"
                  text = (
                      f"{title}\n"
                      "Vieta: 55.4566591, 21.1061368\n"
                      f"Vejo kryptis is: {d:.0f}°\n"
                      f"Greitis: {s:.1f} m/s\n"
                      f"Gusiai: {g:.1f} m/s\n"
                      f"90-135° intervale: {condition}\n"
                      f"Laikas: {date:%Y-%m-%d %H:%M}\n"
                      "Saltinis: Open-Meteo modelio duomenys"
                  )
                  data = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
                  print("Siunciama Telegram zinute...", flush=True)
                  result = api(f"https://api.telegram.org/bot{token}/sendMessage", "Telegram", data)
                  if result.get("ok") is not True:
                      raise RuntimeError("Telegram nepatvirtino siuntimo.")
                  print("Zinute issiusta.")
              else:
                  print("Naujo pranesimo nereikia.")

              if not test:
                  path.write_text(json.dumps({"inside": inside}) + "\n")

          try:
              main()
          except Exception as e:
              message = str(e) if isinstance(e, RuntimeError) else type(e).__name__
              print("Klaida: " + message, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Issaugoti busena
        run: |
          if [ -f wind_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wind_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update wind state"
              git push
            fi
          fi
